name: Fork checks
run-name: Fork checks for PR ${{ github.event.pull_request.number || inputs.pr_number }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open pull request to validate at this exact branch commit'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fork-checks-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fork-checks:
    name: fork-checks
    if: github.repository == 'dsgnrishere/astryx'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the exact pull request merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const number = process.env.PR_NUMBER;
          if (!/^[1-9][0-9]*$/.test(number)) throw new Error('Invalid PR number');
          const repository = process.env.GITHUB_REPOSITORY;
          const pr = JSON.parse(execFileSync('gh', ['api', `repos/${repository}/pulls/${number}`], {encoding: 'utf8'}));
          if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.base.repo.full_name !== repository) throw new Error('Expected an open PR into this main');
          if (process.env.EVENT_NAME === 'workflow_dispatch' && (pr.head.repo.full_name !== repository || pr.head.sha !== process.env.DISPATCH_SHA)) throw new Error('Dispatch does not match the current PR head');
          const merge = pr.merge_commit_sha;
          if (!/^[0-9a-f]{40}$/.test(merge || '')) throw new Error('PR has no merge candidate; resolve conflicts first');
          const git = args => execFileSync('git', args, {encoding: 'utf8'}).trim();
          git(['fetch', '--no-tags', `https://github.com/${repository}.git`, `refs/pull/${number}/merge`]);
          if (git(['rev-parse', 'FETCH_HEAD']) !== merge || git(['rev-parse', `${merge}^1`]) !== pr.base.sha || git(['rev-parse', `${merge}^2`]) !== pr.head.sha) throw new Error('PR moved while resolving; retry checks');
          console.log(`Validated exact merge ${merge} for PR #${number}`);
          JS
      - name: Test sync safety
        run: node --test .github/scripts/fork-*.node-test.mjs
